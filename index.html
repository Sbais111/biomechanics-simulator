/* =========================================================
   10. COEFFICIENT OF FRICTION (IB): shoe drag test
   ========================================================= */
function simFric(){
  // Typical (illustrative) static coefficients for shoe–surface pairs
  const MU={court:{court:0.9,dusty:0.45,grass:0.6,wet:0.35,track:0.8},
    boot:{court:0.5,dusty:0.3,grass:1.2,wet:0.8,track:0.6},
    spike:{court:0.4,dusty:0.3,grass:0.9,wet:0.6,track:1.3},
    worn:{court:0.6,dusty:0.3,grass:0.45,wet:0.25,track:0.55}};
  const SHOE={court:{n:'Court shoe',c:'#e2e8f0',a:'#2563eb'},boot:{n:'Football boot',c:'#111827',a:'#facc15'},spike:{n:'Running spike',c:'#f97316',a:'#ffffff'},worn:{n:'Worn trainer',c:'#94a3b8',a:'#64748b'}};
  const SURF={court:{n:'Clean indoor court',g:'court'},dusty:{n:'Dusty indoor court',g:'dusty'},grass:{n:'Dry grass',g:'grass'},wet:{n:'Wet grass',g:'wet'},track:{n:'Synthetic track',g:'track'}};
  const TSLIP=1.6,TEND=3.4,DR=0.75;let ctx,gctx,d;const S={log:[]};const anim=animator(step);
  function read(){const shoe=str('fShoe'),surf=str('fSurf'),m=num('fLoad'),R=m*g,mu=MU[shoe][surf];return{shoe,surf,m,R,mu,mud:mu*DR,Fs:mu*R,Fd:mu*DR*R};}
  function pullAt(t){if(t<=TSLIP)return d.Fs*t/TSLIP;const u=t-TSLIP;return d.Fd+(d.Fs-d.Fd)*Math.exp(-u*18)+d.Fd*0.025*Math.sin(u*38);}
  function step(dt){S.t=Math.min(TEND,S.t+dt);S.F=pullAt(S.t);S.pts.push([S.t,S.F]);if(S.t>TSLIP){S.slip=true;S.off=Math.min(150,S.off+55*dt);}
    const end=S.t>=TEND;if(end){S.done=true;S.log.unshift({shoe:SHOE[d.shoe].n,surf:SURF[d.surf].n,m:d.m,R:d.R,F:d.Fs,mu:d.mu});if(S.log.length>6)S.log.pop();renderLog();}
    api.update();api.draw();if(end){finish('friction');return false;}}
  function renderLog(){const rows=S.log.map(r=>`<tr><td>${r.shoe}<br><span style="color:#8a6a2a">${r.surf}</span></td><td>${fmt(r.R,0)} N</td><td>${fmt(r.F,1)} N</td><td><b>${r.mu.toFixed(2)}</b></td></tr>`).join('');
    setChallenge('friction',`<h4>🧪 Test log</h4>`+(S.log.length?`<table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr style="text-align:left;color:#8a5300"><th>Shoe / surface</th><th>R</th><th>Peak F</th><th>μ</th></tr>${rows}</table>`:'<p>Your results appear here.</p>')+`<p style="margin-top:8px">Try: test the same shoe and surface with double the load. What happens to the peak force? What happens to μ?</p>`);}
  function drawShoe(x,gy,type,m){const s=SHOE[type],L=250,H=78;ctx.save();ctx.translate(x,gy);
    // grip features under the sole
    ctx.fillStyle='#1f2937';
    if(type==='boot'){for(let i=0;i<6;i++){roundRect(ctx,18+i*40,-2,14,12,3);ctx.fill();}}
    if(type==='spike'){for(let i=0;i<5;i++){const sx=150+i*20;ctx.beginPath();ctx.moveTo(sx,-2);ctx.lineTo(sx+5,9);ctx.lineTo(sx+10,-2);ctx.fill();}}
    const lift=type==='boot'?10:type==='spike'?8:0;ctx.translate(0,-lift);
    ctx.fillStyle=type==='worn'?'#cbd5e1':'#f8fafc';roundRect(ctx,0,-16,L,16,6);ctx.fill();
    if(type==='court'||type==='worn'){ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;for(let i=8;i<L-6;i+=type==='worn'?28:12){ctx.beginPath();ctx.moveTo(i,-2);ctx.lineTo(i+5,-2);ctx.stroke();}}
    ctx.fillStyle=s.c;ctx.beginPath();ctx.moveTo(6,-16);ctx.lineTo(6,-58);ctx.quadraticCurveTo(10,-H,40,-H);ctx.lineTo(96,-H+4);ctx.quadraticCurveTo(150,-36,214,-30);ctx.quadraticCurveTo(L+4,-26,L,-16);ctx.closePath();ctx.fill();
    ctx.fillStyle=s.a;ctx.beginPath();ctx.moveTo(60,-24);ctx.quadraticCurveTo(120,-58,190,-30);ctx.lineTo(176,-24);ctx.quadraticCurveTo(120,-44,74,-20);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(100+i*16,-H+10+i*9);ctx.lineTo(112+i*16,-H+18+i*9);ctx.stroke();}
    // weight plates sitting in the shoe
    const n=clamp(Math.round(m/2.5),1,8);for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#475569':'#334155';roundRect(ctx,26,-H-10-i*9,58,8,3);ctx.fill();}
    tag(ctx,fmt(m,1)+' kg load',55,-H-24-n*9,C.text);
    ctx.restore();return lift;}
  const api={
    init(c,gc){ctx=c;gctx=gc;},stop(){anim.stop();},
    reset(full){anim.stop();d=read();Object.assign(S,{t:0,F:0,slip:false,off:0,started:false,done:false,pts:[]});if(full)S.log=[];renderLog();},
    update(){d=read();setM('fM1',fmt(d.R,1)+' N');setM('fM2',fmt(S.F,1)+' N');
      setM('fM3',S.done?fmt(d.Fs,1)+' N':'Run the test');setM('fM4',S.done?d.mu.toFixed(2):'—');setM('fM5',S.done?d.mud.toFixed(2):'—');
      setW('friction',`Normal reaction R = m × g = ${fmt(d.m,1)} × 9.8 = <b>${fmt(d.R,1)} N</b><br>`+(S.done?`Peak gauge reading (limiting friction) = <b>${fmt(d.Fs,1)} N</b><br>μ (static) = F ÷ R = ${fmt(d.Fs,1)} ÷ ${fmt(d.R,1)} = <b>${d.mu.toFixed(2)}</b><br>Sliding reading (dynamic friction) ≈ <b>${fmt(d.Fd,1)} N</b> → μ (dynamic) = ${fmt(d.Fd,1)} ÷ ${fmt(d.R,1)} = <b>${d.mud.toFixed(2)}</b>`:'Run the pull test to collect your data, then μ = peak force ÷ R.'));},
    draw(){const W=ctx.W,H=ctx.H,gy=H-96;sky(ctx);ground(ctx,gy,SURF[d.surf].g);
      tag(ctx,SHOE[d.shoe].n+' on '+SURF[d.surf].n.toLowerCase(),W/2,24,C.text);
      const sx=120+S.off,lift=drawShoe(sx,gy,d.shoe,d.m),toeX=sx+250,ty=gy-lift-14;
      if(S.slip&&!S.done||S.slip&&S.off<150){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(sx-12-i*16,gy-6-i*5);ctx.lineTo(sx-50-i*16,gy-6-i*5);ctx.stroke();}}
      // string + force gauge
      const gx=toeX+150;ctx.strokeStyle='#e2e8f0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(toeX-4,ty);ctx.lineTo(gx,ty);ctx.stroke();
      ctx.fillStyle='#e2e8f0';roundRect(ctx,gx,ty-40,140,80,14);ctx.fill();ctx.fillStyle='#0b1630';ctx.beginPath();ctx.arc(gx+42,ty,30,0,Math.PI*2);ctx.fill();
      const scale=Math.max(10,niceStep(d.Fs*1.3/4)*4),ang=-Math.PI*1.25+Math.min(1,S.F/scale)*Math.PI*1.5;
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;for(let i=0;i<=8;i++){const a=-Math.PI*1.25+i/8*Math.PI*1.5;ctx.beginPath();ctx.moveTo(gx+42+Math.cos(a)*24,ty+Math.sin(a)*24);ctx.lineTo(gx+42+Math.cos(a)*29,ty+Math.sin(a)*29);ctx.stroke();}
      ctx.strokeStyle='#ff5c74';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx+42,ty);ctx.lineTo(gx+42+Math.cos(ang)*24,ty+Math.sin(ang)*24);ctx.stroke();
      ctx.fillStyle='#0b1630';ctx.font='800 15px '+FONT;ctx.textAlign='center';ctx.fillText(fmt(S.F,1)+' N',gx+105,ty+5);ctx.font='700 10px '+FONT;ctx.fillText('FORCE',gx+105,ty-14);ctx.fillText('GAUGE',gx+105,ty+22);ctx.textAlign='left';
      // forces on the shoe
      const k=Math.min(3.2,160/Math.max(d.Fs,1));
      arrow(ctx,sx+125,gy+2,sx+125,gy-130,C.norm,'R = '+fmt(d.R,0)+' N',{lx:sx+135,ly:gy-150,align:'left'});
      if(S.F>0.05){arrow(ctx,toeX+6,ty-24,toeX+6+S.F*k,ty-24,C.force,'Pull '+fmt(S.F,1)+' N',{lx:toeX+6+S.F*k/2,ly:ty-48});
        const fr=S.slip?d.Fd:S.F;arrow(ctx,sx+235,gy+12,sx+235-fr*k,gy+12,C.fric,(S.slip?'Dynamic friction ':'Static friction ')+fmt(fr,1)+' N (on the sole)',{lx:sx+235-fr*k/2,ly:gy+40});}
      if(S.started&&!S.slip)badge(ctx,'GRIPPING: static friction = pull',W/2,62,C.fric);
      else if(S.slip)badge(ctx,'SLIPPING: pull exceeded limiting friction',W/2,62,C.force);
      else tag(ctx,'Press "Start pulling": the pull increases steadily',W/2,62,C.dim);
      const hide=predicting('friction')&&!S.done,ymax=Math.max(d.Fs,d.R*0.5,5)*1.3;
      plot(gctx,{xMax:TEND,yMax:S.done?Math.max(ymax,d.R*1.1):ymax,xLabel:'Time (s)',yLabel:'Force gauge reading (N)',empty:S.started?null:'Start pulling to record the force–time trace',
        series:[{pts:S.pts,color:GC.force,label:'Pull = friction while gripping'},...(S.done&&!hide?[{pts:[[0,d.R],[TEND,d.R]],color:GC.ink,dash:[6,5],width:2,label:'Normal reaction R'}]:[])],
        labels:S.done?[{x:TSLIP,y:d.Fs,text:'Limiting friction '+fmt(d.Fs,1)+' N',color:GC.force},{x:TSLIP+1.1,y:d.Fd,text:'Dynamic friction ≈ '+fmt(d.Fd,1)+' N',color:GC.fric}]:[],markerX:S.started&&!S.done?S.t:null});},
    run(){d=read();S.started=true;anim.start();},
    predictAnswer(){const q=read();return Math.abs(q.mu-1)<0.02?'equal':q.mu>1?'greater':'less';}
  };return api;}

  predict:{q:'Will the peak (limiting) friction be greater or less than the normal reaction R?',options:[['less','Less than R (μ < 1)'],['equal','About equal to R (μ ≈ 1)'],['greater','Greater than R (μ > 1)']]},
  questions:[
    {q:'The gauge reading peaks just before the shoe starts to slide. This peak is the…',opts:[['a','dynamic friction'],['b','limiting (maximum static) friction'],['c','normal reaction']],a:'b',hint:'Look at what happens on the graph just before the drop.',why:'Static friction matches the pull until it reaches its maximum value: limiting friction = μR.'},
    {q:'Once the shoe is sliding, the force needed to keep it moving is…',opts:[['a','larger than the peak'],['b','smaller than the peak'],['c','the same as the peak']],a:'b',hint:'Compare the plateau after the drop with the peak.',why:'Dynamic (sliding) friction is smaller than limiting static friction, which is why the trace drops once sliding begins.'},
    {q:'You double the load in the shoe. The coefficient of friction…',opts:[['a','doubles'],['b','halves'],['c','stays the same']],a:'c',hint:'Use the test log: compare R, the peak force and μ.',why:'R doubles and the peak friction doubles, so μ = F ÷ R is unchanged. μ depends only on the two surfaces.'},
    {q:'Why do sprinters wear spikes on a synthetic track?',opts:[['a','To increase μ, so more horizontal force can be applied without slipping'],['b','To increase their normal reaction force'],['c','To reduce their mass']],a:'a',hint:'Compare spikes on the track with the other footwear.',why:'Spikes raise μ, increasing limiting friction (μR) so a larger horizontal push-off force can be applied without slipping.'}],
  exam:[
    {course:'ib',q:'In a drag test, a shoe loaded to a normal reaction of 49 N starts to slide when the force gauge reads 44 N. <span class="cmd">Calculate</span> the coefficient of friction.',marks:2,scheme:['μ = F ÷ R = 44 ÷ 49.','μ = 0.90 (no units).']},
    {course:'ib',q:'<span class="cmd">Explain</span> why a netballer is more likely to slip when changing direction on a dusty court.',marks:2,scheme:['Dust reduces the coefficient of friction between the shoe and the court.','So limiting friction (μR) is lower, and the horizontal force needed to change direction is more likely to exceed it, causing a slip.']}],
  sim:simFric()});

const nav=$('nav'),panels=$('panels');
TOPICS.forEach(T=>{const b=document.createElement('button');b.className='nav-item';b.id=T.id+'Nav';b.type='button';if(T.course==='ib')b.dataset.course='ib';
  b.innerHTML=`<span class="nav-icon">${T.icon}</span><span class="nav-name">${T.name}</span><span class="nav-tick">✓</span>`;b.addEventListener('click',()=>activate(T.id));nav.appendChild(b);
  const s=document.createElement('section');s.className='panel';s.id=T.id;if(T.course==='ib')s.dataset.course='ib';s.innerHTML=panelHTML(T);panels.appendChild(s);});
const foot=document.createElement('div');foot.className='nav-foot';foot.innerHTML='✓ = all questions correct<br>Switch to IB for restitution and friction.';nav.appendChild(foot);
TOPICS.forEach(T=>{bindTopic(T);T.controls.forEach(c=>refreshOut(c.id));refreshVis(T);T.sim.init(setupCanvas($(T.id+'Canvas'),900,380),T.graph?setupCanvas($(T.id+'Graph'),900,240):null);
  if(T.presets){const i=T.presets.findIndex(p=>Object.entries(p.set).every(([k,v])=>String(v)===String($(k).value)));if(i>=0){$(T.id+'Preset').value=String(i);if(T.sim.onPreset)T.sim.onPreset(T.presets[i]);}}
  T.sim.reset(true);T.sim.update();updatePredQ(T);markProgress(T);});
$('vceBtn').addEventListener('click',()=>setView('vce'));$('ibBtn').addEventListener('click',()=>setView('ib'));
$('teacherToggle').addEventListener('change',e=>document.body.classList.toggle('teacher',e.target.checked));
setView(view);const saved=store.get('bmsTopic');activate(saved&&BY[saved]&&visible(BY[saved])?saved:TOPICS.find(visible).id);
TOPICS.forEach(T=>T.sim.draw());
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>TOPICS.forEach(T=>T.sim.draw()));
})();
